name: Weekly refresh
# Every Monday 05:17 UTC (06:17 in Nigeria): crawl listings, rebuild the model, publish.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      crawl:
        description: "Crawl fresh listings (untick to rebuild from the files already in the repo)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl, model, export, check, build pages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.crawl }}" = "false" ]; then
            python pipeline/refresh.py --no-crawl
          else
            python pipeline/refresh.py
          fi
      - name: Commit and push (GitHub Pages republishes automatically)
        run: |
          git config user.name "buildocrat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs pipeline/raw
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
          git push
      - name: Tell search engines (IndexNow)
        if: success()
        run: |
          sleep 150
          python indexnow.py
